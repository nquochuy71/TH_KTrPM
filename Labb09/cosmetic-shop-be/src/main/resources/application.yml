spring:
  profiles:
    active: dev
  application:
    name: cosmetic-shop-be
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:cosmetic_shop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:40avSgZRCsBZ10pQTMeOadan4Cms8PS8VbJnwkZbwPRpCUQHycl8b7GZxvvH9}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
