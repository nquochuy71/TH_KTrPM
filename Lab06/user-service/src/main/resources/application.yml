server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

jwt:
  secret: mySecretKeyForHS256MustBeAtLeast32Chars!!
  expiration-ms: 900000       # 15 phút (access token)
  refresh-expiration-ms: 604800000  # 7 ngày (refresh token)
